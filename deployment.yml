apiVersion: apps/v1
kind: Deployment
metadata:
  name: synapse-ui
spec:
  replicas: 1

  selector:
    matchLabels:
      app: synapse-ui

  template:
    metadata:
      labels:
        app: synapse-ui

    spec:
      containers:
        - name: synapse-ui
          image: synapse-ui:latest
          imagePullPolicy: Never
          env:
            - name: VITE_API_URL
              valueFrom:
                ConfigMapKeyRef:
                  name: synapse
                  key: VITE_API_URL

          ports:
            - containerPort: 3000

