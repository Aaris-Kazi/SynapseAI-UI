apiVersion: apps/v1
kind: Deployment

metadata:
  name: synapse-ui-service

spec:
  replicas: 1

  selector:
    matchLabels:
      app: synapse-ui

  template:
    metadata:
      labels:
        app: synapse-ui

    spec:
      containers:
        - name: synapse-ui
          image: aariskazi/synapse-ui:v2
          imagePullPolicy: Never

          envFrom:
            - configMapRef:
                name: synapse

          ports:
            - containerPort: 3000

---
apiVersion: v1
kind: Service

metadata:
  name: synapse-ui-service

spec:
  selector:
    app: synapse-ui

  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
      nodePort: 30080 

  type: NodePort